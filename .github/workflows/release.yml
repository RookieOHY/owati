# 推 v* tag 自动构建并挂 Release 双架构: arm64(M系) + x86_64(Intel)
# HealthTick同款: Apple Silicon / Intel 两个安装包
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  package:
    strategy:
      matrix:
        include:
          - runner: macos-latest    # M系
            arch: aarch64
          - runner: macos-13        # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: 构建并打包
        run: ./Scripts/package.sh
        env:
          ARCH: ${{ matrix.arch }}

      - name: 从tag取版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 上传DMG到Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/owati-${{ steps.ver.outputs.version }}.dmg
