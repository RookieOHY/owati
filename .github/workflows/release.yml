# 推 v* tag 自动构建并挂 Release 双架构: arm64(M系) + x86_64(Intel)
# HealthTick同款: Apple Silicon / Intel 两个安装包
name: Release
on:
  push:
    tags: ["v*"]

jobs:
  package:
    permissions:
      contents: write   # 默认token只读 挂Release必须显式给写权限
    strategy:
      matrix:
        # 单台arm64机器交叉编译双架构 --arch注入 macos-13排队太慢已弃用
        arch: [aarch64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 构建并打包
        run: ./Scripts/package.sh
        env:
          ARCH: ${{ matrix.arch }}

      - name: 从tag取版本号
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: 上传DMG到Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/owati-${{ steps.ver.outputs.version }}-${{ matrix.arch }}.dmg
