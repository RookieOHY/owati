<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>owati 面板 v2 · 极简玻璃</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#1a2a3a 0%,#2a4a5c 50%,#7a5a48); font-family:-apple-system,"SF Pro Display","PingFang SC",sans-serif; }
  .panel { width:300px; height:380px; border-radius:20px; padding:22px 22px 16px; box-sizing:border-box;
           background:rgba(32,36,42,.52); backdrop-filter:blur(30px) saturate(1.3);
           -webkit-backdrop-filter:blur(30px) saturate(1.3);
           border:1px solid rgba(255,255,255,.14);
           box-shadow:0 20px 60px rgba(0,0,0,.4);
           display:flex; flex-direction:column; }
  /* ① 主视觉：AI 生成的玻璃杯（滤色混合）+ 代码水位层 */
  .hero { display:flex; align-items:flex-end; justify-content:center; gap:20px; }
  .cup-wrap { position:relative; width:170px; height:170px; }
  .cup-img { position:absolute; inset:0; width:100%; height:100%;
             mix-blend-mode:screen; /* 纯黑背景消失，玻璃高光叠加 */ }
  /* 水层：多边形贴合杯内壁（按杯图实测轮廓裁切），垫在玻璃图后面 */
  .water { position:absolute; inset:0;
           clip-path:polygon(32% 44.6%, 68% 44.6%, 63.8% 78.5%, 36.2% 78.5%);
           background:linear-gradient(180deg,rgba(100,210,255,.9),rgba(10,132,255,.95));
           overflow:hidden; }
  .water::before { content:''; position:absolute; left:50%; top:0; width:300%; padding-bottom:300%;
                   transform:translate(-50%,-50%); border-radius:46%;
                   background:rgba(255,255,255,.15); animation:spin 9s linear infinite; }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  /* 右侧极简刻度：只有 4 个大刻度 */
  .ruler { position:relative; height:190px; width:36px; }
  .rt { position:absolute; right:0; height:1px; width:10px; background:rgba(255,255,255,.3); }
  .rl { position:absolute; right:16px; transform:translateY(-50%);
        font-size:9px; color:rgba(255,255,255,.4); font-variant-numeric:tabular-nums; }
  .goal-line { position:absolute; right:0; left:-10px; border-top:1px dashed rgba(255,255,255,.55); }
  .goal-tag { position:absolute; right:-2px; transform:translateY(-120%);
              font-size:9px; color:#ffd60a; white-space:nowrap; letter-spacing:.2px; }
  /* 主数字 */
  .num { text-align:center; margin-top:14px; }
  .num b { font-size:40px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums;
           letter-spacing:-1px; line-height:1; }
  .num span { font-size:15px; font-weight:400; color:rgba(255,255,255,.45); margin-left:4px; }
  .num .goal { font-size:12px; color:rgba(255,255,255,.45); display:block; margin-top:6px; }
  /* ② 预留区 */
  .spacer { flex:1; }
  /* ③ 出口按钮：低对比度小图标 */
  .btns { display:flex; justify-content:center; gap:34px; }
  .btns button { background:none; border:none; cursor:pointer; padding:6px 10px;
                 color:rgba(255,255,255,.55); font-size:11px; font-family:inherit;
                 display:flex; align-items:center; gap:5px; transition:.15s; }
  .btns button:hover { color:rgba(255,255,255,.9); }
</style>
</head>
<body>
<div class="panel">
  <!-- ① 主视觉 -->
  <div class="hero">
    <div class="cup-wrap">
      <div class="water"></div>
      <img class="cup-img" src="png/cup.png" alt="玻璃杯">
    </div>
    <div class="ruler">
      <div class="goal-line" style="bottom:100%;"><span class="goal-tag">目标 2L</span></div>
      <div class="rt" style="bottom:0%;"></div><div class="rl" style="bottom:0%;">0</div>
      <div class="rt" style="bottom:50%;"></div><div class="rl" style="bottom:50%;">1L</div>
      <div class="rt" style="bottom:100%;"></div><div class="rl" style="bottom:100%;">2L</div>
    </div>
  </div>
  <div class="num">
    <b>1.25</b><span>/ 2 L</span>
    <span class="goal">还差 750ml 达成今日目标</span>
  </div>
  <!-- ② 预留区 -->
  <div class="spacer"></div>
  <!-- ③ 出口 -->
  <div class="btns">
    <button>⚙ 设置</button>
    <button>⏻ 退出</button>
  </div>
</div>
</body>
</html>
